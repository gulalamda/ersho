jwt:
  # 密钥，至少256位，自己改长一点
  secretKey: abcdefghijklmnabcdefghijklmnabcdefghijklmnihiohihoihiohiohoi
  # token过期时间，单位毫秒，这里设置1小时
  expireTime: 3600000
