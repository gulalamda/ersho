spring:
  application:
    name: ersho

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tlias?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root


    mybatis-plus:
      mapper-locations: classpath:mapper/*.xml
      type-aliases-package: com.example.entity
      configuration:
        map-underscore-to-camel-case: true
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
        spring:
          datasource:
            type: com.alibaba.druid.pool.DruidDataSource
            driver-class-name: com.mysql.cj.jdbc.Driver
            url: jdbc:mysql://localhost:3306/tlias?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
            username: root
            password: root
            druid:
              initial-size: 5
              max-active: 20
              min-idle: 5
              max-wait: 60000


jwt:
  # 密钥，至少256位，自己改长一点
  secretKey: abcdefghijklmnabcdefghijklmnabcdefghijklmnihiohihoihiohiohoi
  # token过期时间，单位毫秒，这里设置1小时
  expireTime: 3600000
